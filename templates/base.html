<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Курсы{% endblock %}</title>
<link rel="stylesheet" href="{{ assets_path }}assets/style.css">
<link rel="icon" type="image/svg+xml" href="{{ assets_path }}assets/favicon.svg">
<link rel="apple-touch-icon" href="{{ assets_path }}assets/apple-touch-icon.png">
</head>
<body>
<div class="page">
  <header>
    {% block header %}{% endblock %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block nav %}{% endblock %}
</div>
</body>
</html>
